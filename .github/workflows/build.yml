name: Build Loved Songs APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the file nicely
        run: cp app/build/outputs/apk/release/app-release.apk LovedSongs.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LovedSongs-apk
          path: LovedSongs.apk

      - name: Publish a direct download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Music app (latest)
          files: LovedSongs.apk
          make_latest: true
