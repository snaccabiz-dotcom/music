plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lazith.lovedsongs'
    compileSdk 34

    defaultConfig {
        applicationId "com.lazith.lovedsongs"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.0"
    }

    // Same signing key on every build, so a newer APK installs over the old one and keeps your songs.
    signingConfigs {
        release {
            storeFile file('lovedsongs.jks')
            storePassword 'lovedsongs'
            keyAlias 'lovedsongs'
            keyPassword 'lovedsongs'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
